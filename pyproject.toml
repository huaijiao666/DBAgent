[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dbagent-coding-agent"
version = "0.1.0"
description = "A local, repository-aware, self-verifying coding agent harness."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "openai>=3.6.0,<4",
]

[project.scripts]
dbagent = "dbagent.cli:main"
dbagent-smoke = "dbagent.smoke:main"
DBA = "dbagent.repl:main"
dba = "dbagent.repl:main"
dbagent-web = "dbagent.web_ui:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dbagent = ["web_assets/*"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
pythonpath = ["src"]
testpaths = ["tests"]
norecursedirs = [".git", ".venv", "fixtures"]
