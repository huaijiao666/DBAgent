<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Snake</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="wrap">
    <header>
      <h1>Snake</h1>
      <div id="hud">
        <span id="score-label">Score</span>
        <span id="score">0</span>
        <button id="run" type="button">Restart</button>
      </div>
    </header>
    <div id="board">
      <canvas id="game" width="480" height="480"></canvas>
      <div id="status"></div>
    </div>
    <p id="help">
      Use <kbd>Arrow Keys</kbd> or <kbd>WASD</kbd> to steer. Press
      <kbd>Space</kbd> after a game over to restart.
    </p>
  </div>
  <script src="game.js"></script>
</body>
</html>
