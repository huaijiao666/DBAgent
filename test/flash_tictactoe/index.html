<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tic-Tac-Toe</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="game">
    <h1>Tic-Tac-Toe</h1>
    <p id="status" class="status" role="status" aria-live="polite">Player X's turn</p>

    <div id="board" class="board" role="grid" aria-label="Tic-Tac-Toe board">
      <!-- 9 cell buttons are created by game.js -->
    </div>

    <button id="restart" class="restart" type="button">Restart</button>
  </main>

  <script src="game.js"></script>
</body>
</html>
